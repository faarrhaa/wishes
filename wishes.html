<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Noreen & Anees · Guest Wishes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Pinyon+Script&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#e8c060;
  --gold2:#d4a843;
  --dark:#fdf0e0;
  --text:#f5e8d0;
  --brown:#f0d5b0;
}
body{
  font-family:'Cormorant Garamond',Georgia,serif;
  background:linear-gradient(145deg,#3d0a18,#5c1128,#4a0e1e);
  min-height:100vh;
  color:var(--text);
  padding:48px 20px 80px;
}

header{
  text-align:center;
  margin-bottom:56px;
}
.header-ornament{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:6px;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:16px;
  opacity:.8;
}
.header-names{
  font-family:'Pinyon Script',cursive;
  font-size:clamp(52px,12vw,90px);
  color:var(--dark);
  line-height:1;
  text-shadow:0 2px 12px rgba(184,134,11,.25);
}
.header-title{
  font-family:'Cinzel',serif;
  font-size:clamp(13px,2.5vw,16px);
  color:var(--gold2);
  letter-spacing:5px;
  margin-top:14px;
}
.divider{
  width:120px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  margin:20px auto 0;
}

/* Stats bar */
.stats{
  text-align:center;
  margin-bottom:44px;
}
.stats-count{
  font-family:'Cinzel',serif;
  font-size:clamp(28px,6vw,48px);
  color:var(--gold);
  line-height:1;
}
.stats-label{
  font-size:13px;
  letter-spacing:4px;
  color:var(--brown);
  font-family:'Cinzel',serif;
  text-transform:uppercase;
  margin-top:6px;
}

/* Live badge */
.live-badge{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(232,192,96,.12);
  border:1px solid rgba(232,192,96,.3);
  border-radius:20px;
  padding:6px 16px;
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:3px;
  color:var(--gold);
  margin-top:16px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:#4caf50;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* Grid */
.wishes-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
  max-width:1100px;
  margin:0 auto;
}

.wish-card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(232,192,96,.22);
  border-radius:12px;
  padding:24px 20px;
  backdrop-filter:blur(6px);
  transition:transform .3s, box-shadow .3s;
  position:relative;
  overflow:hidden;
}
.wish-card::before{
  content:'❝';
  position:absolute;
  top:10px;right:14px;
  font-size:36px;
  color:rgba(232,192,96,.1);
  font-family:Georgia,serif;
  line-height:1;
}
.wish-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(0,0,0,.3);
}
.wish-name{
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:2px;
  color:var(--gold);
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:1px dashed rgba(232,192,96,.25);
}
.wish-text{
  font-style:italic;
  font-size:15px;
  color:var(--text);
  line-height:1.7;
}
.wish-time{
  font-size:10px;
  color:rgba(245,232,208,.3);
  margin-top:12px;
  letter-spacing:1px;
  font-family:'Cinzel',serif;
}

/* Empty state */
.empty{
  text-align:center;
  grid-column:1/-1;
  padding:60px 20px;
  color:var(--brown);
  font-style:italic;
  font-size:18px;
}

/* Loading */
#loading{
  text-align:center;
  padding:80px 20px;
}
.spinner{
  width:50px;height:50px;
  border-radius:50%;
  border:2px solid rgba(232,192,96,.15);
  border-top-color:var(--gold);
  animation:spin 1.4s linear infinite;
  margin:0 auto 20px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  font-family:'Cinzel',serif;
  font-size:13px;
  letter-spacing:4px;
  color:var(--gold);
  opacity:.7;
}

footer{
  text-align:center;
  margin-top:70px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:4px;
  color:rgba(232,192,96,.4);
}
</style>
</head>
<body>

<header>
  <div class="header-ornament">✦ Guest Wishes ✦</div>
  <div class="header-names">Noreen & Anees</div>
  <div class="header-title">Wedding Guestbook</div>
  <div class="divider"></div>
  <div class="live-badge">
    <div class="live-dot"></div>
    Live · Updates automatically
  </div>
</header>

<div class="stats">
  <div class="stats-count" id="wish-count">—</div>
  <div class="stats-label">Wishes Received</div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading wishes…</div>
</div>

<div class="wishes-grid" id="wishes-grid" style="display:none;"></div>

<footer>Noreen &amp; Anees · 6 · 08 · 2026 · Alexandria</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFsttdLA2s6FjiX3TizKq2l2MUvQ10-JU",
    authDomain: "noreen-anees-wedding.firebaseapp.com",
    projectId: "noreen-anees-wedding",
    storageBucket: "noreen-anees-wedding.firebasestorage.app",
    messagingSenderId: "1071964897212",
    appId: "1:1071964897212:web:e7f522ec544b82d71fb5b9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const wishesCol = collection(db, "wishes");
  const q = query(wishesCol, orderBy("createdAt", "desc"));

  function formatTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts.seconds * 1000);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  }

  onSnapshot(q, (snapshot) => {
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('wishes-grid');
    grid.style.display = 'grid';

    const wishes = snapshot.docs.map(doc => doc.data());
    document.getElementById('wish-count').textContent = wishes.length;

    if (wishes.length === 0) {
      grid.innerHTML = '<div class="empty">No wishes yet — be the first to leave one 💕</div>';
      return;
    }

    grid.innerHTML = wishes.map(w => `
      <div class="wish-card">
        <div class="wish-name">${escHtml(w.name)}</div>
        <div class="wish-text">${escHtml(w.text)}</div>
        ${w.createdAt ? `<div class="wish-time">${formatTime(w.createdAt)}</div>` : ''}
      </div>
    `).join('');
  });

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
